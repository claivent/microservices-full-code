apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - env:
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          value: alibou
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          value: alibou
        - name: ME_CONFIG_MONGODB_SERVER
          value: mongo-db
        - name: ME_CONFIG_MONGODB_URL
          value: mongodb://mongo-db:27017
        - name: ME_CONFIG_MONGODB_ENABLE_ADMIN
          value: 'true'
        - name: ME_CONFIG_SITE_SESSIONSECRET
          value: secret-klic-vytvorit-dle-uvazeni
        - name: ME_CONFIG_BASICAUTH
          value: 'true'
        - name: ME_CONFIG_SITE_AUTH_USERNAME
          value: admin
        - name: ME_CONFIG_SITE_AUTH_PASSWORD
          value: Heslo1
        image: mongo-express
        imagePullPolicy: IfNotPresent
        name: mongo-express
        ports:
        - containerPort: 8081
