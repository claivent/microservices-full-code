apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9411
          env:
            # >> tohle je klíčové <<
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /zipkin
            - name: ZIPKIN_UI_BASEPATH
              value: /zipkin


