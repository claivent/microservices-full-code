apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail-dev
  template:
    metadata:
      labels:
        app: mail-dev
    spec:
      containers:
      - image: maildev/maildev
        imagePullPolicy: IfNotPresent
        name: mail-dev
        ports:
        - containerPort: 1080
        - containerPort: 1025
