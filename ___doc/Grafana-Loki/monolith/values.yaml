grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin
  service:
    type: ClusterIP
    port: 80
  persistence:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: true
          editable: true

loki:
  enabled: true
  isDefault: true
  persistence:
    enabled: false

promtail:
  enabled: true
  config:
    lokiAddress: http://loki:3100/loki/api/v1/push