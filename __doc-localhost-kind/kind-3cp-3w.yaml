kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# volitelné – zpřístupní API z hosta/LAN a připne port 6443
networking:
  ipFamily: dual
  podSubnet: "10.244.0.0/16,fd00:10:244::/56"
  serviceSubnet: "10.96.0.0/12,fd00:10:96::/112"
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
nodes:
  # 3x control-plane (HA, stacked etcd)
  - role: control-plane
    extraPortMappings:        # volitelné: mapování 80/443 pro ingress testy
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: control-plane
  - role: control-plane
  # 3x worker
  - role: worker
  - role: worker
  - role: worker
