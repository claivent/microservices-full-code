apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: claivent/micro:order-service-0.1.10
          imagePullPolicy: Always
          ports:
            - containerPort: 8070
#          env:
#            - name: SPRING_PROFILES_ACTIVE
#              value: native
