apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: claivent/micro:customer-service-0.1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
#          env:
#            - name: SPRING_PROFILES_ACTIVE
#              value: native
