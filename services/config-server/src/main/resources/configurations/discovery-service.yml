eureka:
  instance:
    #hostname: localhost
    hostname: discovery-service.default.svc.cluster.local
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://discovery-service.default.svc.cluster.local:8761/eureka/

server:
  port: 8761


management:
  #  endpoints:
  #    web:
  #      exposure:
  #        include: health, info, metrics, prometheus, env
  #  endpoint:
  #    health:
  #      show-details: always
  #  tracing:
  #    sampling:
  #      probability: 1.0
  #    export:
  #      zipkin:
  #        endpoint: http://zipkin.observability.svc.cluster.local:9411/api/v2/spans

  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env
  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://zipkin.observability.svc.cluster.local:9411/api/v2/spans


logging:
  level:
    root: DEBUG
    brave:
      propagation:
        tracecontext:
          Tracestate: DEBUG
