server:
  port: 8761

eureka:
  instance:
    #hostname: localhost
    hostname: discovery-service.default.svc.cluster.local
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://discovery-service.default.svc.cluster.local:8761/eureka/




management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env
  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin.default.svc.cluster.local:9411/api/v2/spans


#logging:
#  level:
#    root: DEBUG
#    brave:
#      propagation:
#        tracecontext:
#          Tracestate: DEBUG

logging:
  level:
#    org.springframework.web: DEBUG
#    org.springframework.cloud.sleuth: DEBUG
#    org.springframework.boot.actuate.autoconfigure.tracing: DEBUG
#    io.micrometer.tracing: DEBUG
#    zipkin2.reporter: DEBUG
  logging:
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:-},traceId=%X{traceId:-},spanId=%X{spanId:-}] [%t] %logger{36} : %msg%n"
      # (volitelné) sjednocení LEVEL tagu, pokud ho někde používáš:
      level: "%5p [${spring.application.name:-},traceId=%X{traceId:-},spanId=%X{spanId:-}]"
