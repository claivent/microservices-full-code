server:
  port: 8090
spring:
  data:
    mongodb:
      username: alibou
      password: alibou
      host: mongo-db.default.svc.cluster.local
      port: 27017
      database: customer
      authentication-database: admin
#eureka:
#  instance:
#    prefer-ip-address: true
#    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

eureka:
  instance:
    # secure-port-enabled: false
    # secure-port: 443
    prefer-ip-address: false
    hostname: customer.claivent.website
    non-secure-port: 2052
    non-secure-port-enabled: true
    home-page-url:    http://customer.claivent.website:2052/
    status-page-url:  http://customer.claivent.website:2052/actuator
    health-check-url: http://customer.claivent.website:2052/actuator/health
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    zipkin:
      base-url: http://zipkin:9411
      endpoint: http://zipkin:9411/api/v2/spans
