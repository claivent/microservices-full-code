spring:
  data:
    mongodb:
      # Jednodušší a spolehlivější je použít URI:
      uri: mongodb://alibou:alibou@mongo-db.default.svc.cluster.local:27017/customer?authSource=admin

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service.default.svc.cluster.local:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}




