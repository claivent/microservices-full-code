spring:
  profiles:
    active: native
  application:
    name: config-server
  cloud:
    config:
      override-system-properties: false
      server:
        native:
          search-locations: classpath:/configurations

name:
  value: alibou

server:
  port: 8888

eureka:
  instance:
    hostname: discovery-service.default.svc.cluster.local
  client:
    service-url:
      defaultZone: http://discovery-service.default.svc.cluster.local:8761/eureka/


