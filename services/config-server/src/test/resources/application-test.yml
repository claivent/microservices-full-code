server:
  port: 8888   # Config Server bude poslouchat na portu 8888

spring:
  application:
    name: config-server

  profiles:
    active: native   # čte konfigurace z classpath:/configurations

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configurations

# Zakáže Eureku (nebude se snažit registrovat ani připojovat)
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    enabled: false